# Review-only template. It denies every staff request until an operator installs
# and verifies the approved identity-aware access check. Do not remove auth_request.
# Copy dist-admin into /srv/amaara/staff/Amaara-Creations/ after an approved build.
server {
    listen 443 ssl;
    server_name staff.invalid;
    root /srv/amaara/staff;

    ssl_certificate /etc/amaara/approved-staff-fullchain.pem;
    ssl_certificate_key /etc/amaara/approved-staff-private-key.pem;
    # Install the reviewed header template with actual API/media origins first.
    include /etc/amaara/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;

    # Applies to HTML, deep links and guessed asset URLs alike. The real access
    # service must verify provider signatures, audience, expiry, staff group and MFA.
    auth_request /_staff_access;

    location = /_staff_access {
        internal;
        auth_request off;
        return 403;
        # Replace this deny-only body with the approved identity provider's
        # documented auth-request adapter. An unavailable adapter must deny access.
        # Never trust a caller-supplied email, group or X-User header as identity.
    }

    location ~ (^|/)(\.git|\.vite)(/|$) { return 404; }
    location ~* \.map$ { return 404; }
    location /Amaara-Creations/ {
        try_files $uri /Amaara-Creations/index.html;
    }
    location / { return 404; }
}
