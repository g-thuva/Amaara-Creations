name: Deterministic browser acceptance
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run lint && npm run typecheck && npm test
        working-directory: client
      - run: npm audit --audit-level=moderate
        working-directory: client
      - run: npm run test:e2e
        working-directory: client
      - run: npm run test:e2e:production && npm run check:performance
        working-directory: client
      - name: Preserve production-build lab measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-evidence
          path: .runtime/release-performance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve failed deterministic browser context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-context
          path: client/test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
