name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
  VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
  VITE_MANAGEMENT_LOGIN_URL: ${{ vars.VITE_MANAGEMENT_LOGIN_URL }}
  VITE_PUBLIC_BASE_PATH: /Amaara-Creations/
  VITE_ROUTER_MODE: hash

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages_configuration:
    name: Check public Pages configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test Pages configuration policy
        run: python -m unittest discover -s tests/release_tools -p test_pages_config.py -v
      - name: Determine whether public deployment is configured
        id: pages
        run: python scripts/check-pages-config.py --github-preflight

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/be.Tests/be.Tests.csproj
      - run: dotnet build tests/be.Tests/be.Tests.csproj --configuration Release --no-restore
      - run: dotnet test tests/be.Tests/be.Tests.csproj --configuration Release --no-restore --no-build

  frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm test
        working-directory: client

  build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, pages_configuration]
    if: ${{ needs.pages_configuration.outputs.ready == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require approved public API configuration before building Pages
        run: python scripts/check-pages-config.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm run check:isolation
        working-directory: client
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
